# Routine di questo agente. La regia le legge e, all'ora indicata, manda
# all'agente il messaggio "esegui la routine <nome>".
# cron: minuto ora giorno-mese mese giorno-settimana (fuso Europe/Rome)
timezone: Europe/Rome
routines:
  - name: riflessione
    cron: "0 21 * * 1-5"
    prompt: "esegui la routine riflessione"
